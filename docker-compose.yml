version: "3.9"

services:
  # ── MongoDB ────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: gridmind_dev
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Node.js / Express backend + hackathon judging API ──────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/gridmind_dev
      JWT_SECRET: gridmind_jwt_secret_change_me_in_production_32chars
      JWT_EXPIRES_IN: 7d
      FASTAPI_URL: http://fastapi:8000
      CLIENT_URL: http://localhost:5173
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── FastAPI Python AI microservice ─────────────────────────────
  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      FASTAPI_PORT: 8000
      DEBUG: "false"
      ENVIRONMENT: production
      MONGODB_URI: mongodb://mongo:27017/gridmind_dev
      EXPRESS_URL: http://backend:3001
    ports:
      - "8000:8000"

  # ── React / Vite frontend ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  mongo_data:
